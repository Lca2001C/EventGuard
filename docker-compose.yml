services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventguard
      POSTGRES_PASSWORD: eventguard
      POSTGRES_DB: eventguard
      PGPORT: 15432
    ports:
      - "15432:15432"
    command: ["postgres", "-c", "port=15432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventguard -d eventguard -p 15432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://eventguard:eventguard@postgres:15432/eventguard?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      DATABASE_URL: postgresql://eventguard:eventguard@postgres:15432/eventguard?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

volumes:
  postgres-data:
